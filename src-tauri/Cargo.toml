[package]
name = "yachiyo-desktop"
version = "1.1.0"
license = "MIT"
authors = ["Neon-Soda"]
repository = "https://github.com/Neon-Soda/Yachiyo-Jukebox"
edition = "2021"
default-run = "Yachiyo"

[[bin]]
name = "Yachiyo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = "0.8"
regex = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
aes-gcm = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rfd = "0.15"
dunce = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Memory", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Registry", "Win32_System_Pipes"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = "thin"
strip = true
opt-level = "s"
